<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 70" fill="none">
  <!-- Icon scaled to 0.31x from stacked logo, y+8 offset to center in 70px height -->
  <!-- Magnifying glass arc: center(25,30), r=18 -->
  <path d="M 40 39 A 18 18 0 1 0 34 46"
        stroke="#8DC21F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Handle from 5 o'clock down to lower-right -->
  <line x1="34" y1="46" x2="57" y2="66"
        stroke="#8DC21F" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow shaft: from lower-left to upper-right -->
  <line x1="13" y1="66" x2="63" y2="12"
        stroke="#8DC21F" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrowhead L-shape -->
  <polyline points="36,12 63,12 63,25"
            stroke="#8DC21F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- REVEAL RANK text -->
  <text x="72" y="42" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="22" fill="#1a1a1a" letter-spacing="1">REVEAL RANK</text>
</svg>
