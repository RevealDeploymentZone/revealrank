<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 70" fill="none">
  <!--
    Same design scaled by 0.37
    Circle center ~(22,35), radius ~22
    Arrowhead at y=5 — clearly above circle top (y=13)
  -->
  <!-- Magnifying glass arc -->
  <path d="M 41 45 A 22 22 0 1 0 33 53"
        stroke="#8DC21F" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Handle -->
  <line x1="33" y1="53" x2="43" y2="64"
        stroke="#8DC21F" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrow shaft -->
  <line x1="3" y1="59" x2="48" y2="5"
        stroke="#8DC21F" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrow head L-shape -->
  <polyline points="33,5 48,5 48,20"
            stroke="#8DC21F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- REVEAL RANK text -->
  <text x="62" y="44" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="22" fill="#1a1a1a" letter-spacing="1">REVEAL RANK</text>
</svg>
