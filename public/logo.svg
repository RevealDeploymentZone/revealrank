<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 230" fill="none">
  <!-- Magnifying glass circle: center(90,82), radius=54 -->
  <!-- Arc from 4-oclock (135,107) going LONG way (counterclockwise in screen) to 5-oclock (115,128) -->
  <path d="M 135 107 A 54 54 0 1 0 115 128"
        stroke="#8DC21F" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Handle: extends from 5-oclock downward-right -->
  <line x1="115" y1="128" x2="148" y2="163" stroke="#8DC21F" stroke-width="16" stroke-linecap="round"/>
  <!-- Arrow diagonal shaft: lower-left to upper-right, crossing through glass -->
  <line x1="62" y1="163" x2="170" y2="42" stroke="#8DC21F" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrow head: L-shape at tip (horizontal left + vertical down) -->
  <polyline points="128,42 170,42 170,84"
            stroke="#8DC21F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- REVEAL RANK text -->
  <text x="105" y="213" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="26" fill="#1a1a1a" letter-spacing="3">REVEAL RANK</text>
</svg>
