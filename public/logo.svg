<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 230" fill="none">
  <!-- Magnifying glass arc: center(79,72), r=58, gap at 4-5 o'clock -->
  <path d="M 129 100 A 58 58 0 1 0 108 121"
        stroke="#8DC21F" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Handle from 5 o'clock down to lower-right -->
  <line x1="108" y1="121" x2="183" y2="188"
        stroke="#8DC21F" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrow shaft: from lower-left to upper-right -->
  <line x1="43" y1="188" x2="202" y2="14"
        stroke="#8DC21F" stroke-width="11" stroke-linecap="round"/>
  <!-- Arrowhead L-shape: horizontal left then vertical down -->
  <polyline points="116,14 202,14 202,56"
            stroke="#8DC21F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="105" y="218" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="24" fill="#1a1a1a" letter-spacing="3">REVEAL RANK</text>
</svg>
