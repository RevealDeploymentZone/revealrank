<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 230" fill="none">
  <!-- Circle arc: center(90,82), r=54, from 4-oclock to 5-oclock going long way -->
  <path d="M 135 107 A 54 54 0 1 0 115 128"
        stroke="#a3d437" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Handle extending from 5-oclock downward-right -->
  <line x1="115" y1="128" x2="148" y2="163" stroke="#a3d437" stroke-width="16" stroke-linecap="round"/>
  <!-- Arrow shaft: lower-left to upper-right, crossing through glass -->
  <line x1="62" y1="163" x2="170" y2="42" stroke="#a3d437" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrow head: L-shape at tip -->
  <polyline points="128,42 170,42 170,84"
            stroke="#a3d437" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- REVEAL RANK text -->
  <text x="105" y="213" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="26" fill="#ffffff" letter-spacing="3">REVEAL RANK</text>
</svg>
